<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- A touch painting game: no pinch-zoom (a two-finger drag must paint, not zoom the page), no rubber-band scroll. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F5EDDA">
  <title>Spray &amp; Peel</title>
  <style>
    /* Spray & Peel web play (ColorBloomBuild.BuildWebGL). The game lays itself out for a portrait phone, so on a wide
       window the canvas keeps the window's HEIGHT and at most 9:16 of width, centred on the game's cream (the clean
       streak page's #F5EDDA); on a phone it simply fills the screen. Recipe from Glasslight / Paper_eat. */
    :root { --cream: #F5EDDA; --cream-top: #F5E3C3; --coral: #FB5936; --cocoa: #70503C; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--cream);
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    }
    #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, var(--cream-top) 0%, var(--cream) 30%); }
    #shell { position: relative; height: 100%; height: 100dvh; width: min(100vw, calc(100dvh * 9 / 16)); overflow: hidden;
      background: var(--cream); box-shadow: 0 0 0 1px rgba(112,80,60,.08), 0 16px 50px rgba(112,80,60,.18); }
    @supports not (height: 100dvh) { #shell { width: min(100vw, calc(100vh * 9 / 16)); } }
    #unity-canvas { display: block; width: 100%; height: 100%; background: var(--cream); touch-action: none; outline: none; }
    #boot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: var(--cream); transition: opacity .45s; z-index: 2; }
    #boot.done { opacity: 0; pointer-events: none; }
    #name { font-weight: 700; font-size: 26px; color: var(--cocoa); letter-spacing: .01em; }
    #bar { width: 52%; max-width: 280px; height: 8px; border-radius: 4px; background: rgba(112,80,60,.14); overflow: hidden; }
    #fill { height: 100%; width: 0%; background: var(--coral); border-radius: 4px; transition: width .25s; }
    #pct { font-size: 12px; color: rgba(112,80,60,.6); font-variant-numeric: tabular-nums; }
    #err { position: absolute; inset: 0; display: none; padding: 24px; z-index: 3; background: var(--cream); color: #9a3b26;
      font-size: 13px; line-height: 1.6; overflow: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="shell">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="boot"><div id="name">Spray &amp; Peel</div><div id="bar"><div id="fill"></div></div><div id="pct">0%</div></div>
      <div id="err"></div>
    </div>
  </div>
  <script>
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/web.data.unityweb",
      frameworkUrl: buildUrl + "/web.framework.js.unityweb",
      codeUrl: buildUrl + "/web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Supercent",
      productName: "Spray _ Peel",
      productVersion: "0.1.0",
      // every file the game writes under persistentDataPath (outgame.json, the sketchbook index and prints) reaches IndexedDB
      // on its own — without it only a later PlayerPrefs.Save flushed them, so a reload lost stars, prints and seen popups
      // (batch1, bug hunt D1). (Unity substitutes "&" in PRODUCT_NAME with "_": the visible name is written literally above,
      // productName stays as it is — it keys the IndexedDB / cache paths.)
      autoSyncPersistentDataPath: true,
      // phones report 3x; the game draws a full-screen paint composite every frame, 2x is plenty and keeps it cool
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      // an error is shown, never swallowed: a silent failure looks exactly like "still loading"
      showBanner: function (msg, type) {
        if (type !== "error") { console.warn("[unity]", msg); return; }
        var e = document.querySelector("#err"); e.style.display = "block"; e.textContent += msg + "\n";
      },
    };
    var fill = document.querySelector("#fill"), pct = document.querySelector("#pct"), boot = document.querySelector("#boot");
    // the page must never scroll or zoom under a painting finger
    document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
    var script = document.createElement("script");
    script.src = buildUrl + "/web.loader.js";
    script.onerror = function () { config.showBanner("Could not load " + script.src, "error"); };
    script.onload = function () {
      createUnityInstance(document.querySelector("#unity-canvas"), config, function (p) {
        var v = Math.round(p * 100); fill.style.width = v + "%"; pct.textContent = v + "%";
      }).then(function (instance) {
        window.unityInstance = instance; boot.classList.add("done");
      }).catch(function (message) { config.showBanner(String(message), "error"); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
